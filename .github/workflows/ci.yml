name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Smoke-test CLI on sample data
        run: python -m variance_analyst data/sample_budget_vs_actuals.csv
      - name: Web demo uses the same sample data
        run: |
          cmp data/sample_budget_vs_actuals.csv docs/sample.csv
          cmp data/sample_revenue_pvm.csv docs/sample_pvm.csv
      - name: Smoke-test price / volume / mix on the PVM sample
        run: python -m variance_analyst data/sample_revenue_pvm.csv | grep "Price / volume / mix"
