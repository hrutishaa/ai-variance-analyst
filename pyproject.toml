[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-variance-analyst"
version = "0.1.0"
description = "AI financial variance analyst: budget vs actuals, materiality flags, plain-English commentary"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hrutishaa Nanduti" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
variance-analyst = "variance_analyst.cli:main"

[tool.setuptools]
packages = ["variance_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
